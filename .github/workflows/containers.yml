name: Build Container Image

on:
  push:
    branches:
      - dev

env:
  registry: kongsgaard-aps
  name: geospeckle

jobs:
  build-image:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Log into registry ${{ env.registry }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io/${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        run: docker build -t ghcr.io/${{ env.registry }}/${{ env.name }}:${{ github.run_number }} .

      - name: Tag Image
        if: github.event_name != 'pull_request'
        run: docker tag ghcr.io/${{ env.registry }}/${{ env.name }}:${{ github.run_number }}

      - name: Push Image
        if: github.event_name != 'pull_request'
        run: docker push --all-tags ghcr.io/${{ env.registry }}/${{ env.name }}